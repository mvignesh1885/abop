<div class="utility-section">
    <h2>ABOP Utility</h2>

    <!-- Checkboxes -->
    <div class="checkbox-group">
        <label>Sell Rx <input type="checkbox" id="sell_rx" name="sell_rx"></label>
        <label>Move to Fill <input type="checkbox" id="move_fill" name="move_fill"></label>
        <label>ABOP <input type="checkbox" id="abop" name="abop"></label>
    </div>

    <!-- Environment Dropdown -->
    <div class="env-store-group">
        <label for="env-dropdown">Env:</label>
        <select id="env-dropdown">
            <option value="">-- Select Environment --</option>
            <option value="sys1">Sys1</option>
            <option value="sys2">Sys2</option>
        </select>
        
        <input type="text" id="store-number" placeholder="Enter Store Number">
    </div>

    <!-- Input Fields -->
    <div class="input-group">
        <button id="minus-btn">-</button>
        <input type="text" id="rx-nbr" placeholder="Enter Rx Nbr">
        <input type="text" id="fill-nbr" placeholder="Enter Fill Nbr">
        <input type="text" id="fill-disp" placeholder="Enter Fill Disp">
        <button id="plus-btn">+</button>
    </div>

    <!-- Action Buttons -->
    <div class="button-group">
        <button id="submit-btn">Submit</button>
    </div>
</div>
<script>
    
    function updateInputGroupState() {
        console.log("Running updateInputGroupState...");
        
        let moveToFillCheckbox = document.getElementById("move_fill"); // Corrected ID
        let otherCheckboxes = [document.getElementById("sell_rx"), document.getElementById("abop")]; // Other checkboxes
        let inputGroup = document.querySelector(".input-group");

        if (!moveToFillCheckbox || !inputGroup) {
            console.error("Required elements not found.");
            return;
        }

        let otherChecked = otherCheckboxes.some(cb => cb.checked);

        if (moveToFillCheckbox.checked && !otherChecked) {
            inputGroup.classList.add("disabled");
            inputGroup.querySelectorAll("input, button").forEach(el => el.disabled = true);
        } else {
            inputGroup.classList.remove("disabled");
            inputGroup.querySelectorAll("input, button").forEach(el => el.disabled = false);
        }
    }

    function setupCheckboxListeners() {
        let allCheckboxes = document.querySelectorAll("input[type='checkbox']");
        allCheckboxes.forEach(checkbox => {
            checkbox.addEventListener("change", updateInputGroupState);
        });

        console.log("Checkbox listeners attached.");
        updateInputGroupState(); // Run once on load
    }

    document.addEventListener("DOMContentLoaded", setupCheckboxListeners);
</script>
