<div class="utility-section">
    <h2>ABOP Utility</h2>

    <!-- Checkboxes -->
    <div class="checkbox-group">
        <label>Sell Rx <input type="checkbox" id="sell_rx" name="sell_rx"></label>
        <label>Move to Fill <input type="checkbox" id="move_fill" name="move_fill"></label>
        <label>ABOP <input type="checkbox" id="abop" name="abop"></label>
    </div>

    <!-- Environment Dropdown -->
    <div class="env-store-group">
        <label for="env-dropdown">Env:</label>
        <select id="env-dropdown">
            <option value="">-- Select Environment --</option>
            <option value="sys1">Sys1</option>
            <option value="sys2">Sys2</option>
        </select>
        
        <input type="text" id="store-number" placeholder="Enter Store Number">
    </div>

    <!-- Input Groups Container -->
    <div id="input-groups">
        <div class="input-group">
            <button class="minus-btn">-</button>
            <input type="text" class="rx-nbr" placeholder="Enter Rx Nbr">
            <input type="text" class="fill-nbr" placeholder="Enter Fill Nbr">
            <input type="text" class="fill-disp" placeholder="Enter Fill Disp">
            <button class="plus-btn">+</button>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="button-group">
        <button id="submit-btn">Submit</button>
    </div>
</div>
