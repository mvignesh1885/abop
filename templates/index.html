<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Utilities</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="container">
    <h1>QA Utilities</h1>
    
    <label for="utility-select">Select Utility:</label>
    <select id="utility-select" onchange="loadUtility()">
        <option value="">-- Select --</option>
        <option value="abop">ABOP</option>
        <option value="putty_launcher">Putty Launcher</option>
    </select>

    <div id="utility-container" class="utility-container">
        <!-- Loaded content will be displayed here -->
    </div>
</div>

<script>
    function loadUtility() {
        let selectedUtility = document.getElementById("utility-select").value;
        if (selectedUtility) {
            fetch("/load_utility/" + selectedUtility)
                .then(response => response.text())
                .then(html => {
                    const utilityContainer = document.getElementById("utility-container");
                    utilityContainer.innerHTML = html;
                    window.history.pushState({}, "", "/MainPage/" + selectedUtility);
    
                    // Ensure JS is loaded only after the content is added
                    setTimeout(() => {
                        loadUtilityScript(selectedUtility);
                    }, 100);
                })
                .catch(error => console.error("Error loading utility:", error));
        } else {
            document.getElementById("utility-container").innerHTML = "";
        }
    }
    
    function loadUtilityScript(utilityName) {
        const scriptId = "utility-script";
        let existingScript = document.getElementById(scriptId);
    
        // Remove old script if exists
        if (existingScript) {
            existingScript.remove();
        }
    
        let script = document.createElement("script");
        script.id = scriptId;
        script.src = `/static/${utilityName}.js`;
        script.onload = function () {
            console.log(`${utilityName}.js loaded successfully.`);
    
            setTimeout(() => {
                if (utilityName === "abop" && window.ABOPUtility && typeof window.ABOPUtility.init === "function") {
                    console.log("Executing ABOPUtility.init()");
                    window.ABOPUtility.init();
                } else if (utilityName === "putty_launcher" && window.PuttyLauncher && typeof window.PuttyLauncher.init === "function") {
                    console.log("Executing PuttyLauncher.init()");
                    window.PuttyLauncher.init();
                } else {
                    console.error(`${utilityName}.init is not defined.`);
                }
            }, 100);
        };
    
        document.body.appendChild(script);
    }
    </script>
    
</body>
</html>
