<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Utilities</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="container">
    <h1>QA Utilities</h1>
    
    <label for="utility-select">Select Utility:</label>
    <select id="utility-select" onchange="loadUtility()">
        <option value="">-- Select --</option>
        <option value="abop">ABOP</option>
    </select>

    <div id="utility-container" class="utility-container">
        <!-- Loaded content will be displayed here -->
    </div>
</div>

<script>
    function loadUtility() {
        let selectedUtility = document.getElementById("utility-select").value;
        if (selectedUtility) {
            fetch("/load_utility/" + selectedUtility)
                .then(response => response.text())
                .then(html => {
                    const utilityContainer = document.getElementById("utility-container");
                    utilityContainer.innerHTML = html;
                    window.history.pushState({}, "", "/MainPage/" + selectedUtility);
                    
                    // Ensure JavaScript inside dynamically loaded content runs
                    executeScripts(utilityContainer);

                    // Call function manually after HTML loads
                    setTimeout(() => {
                        if (typeof setupCheckboxListeners === "function") {
                            setupCheckboxListeners();
                        } else {
                            console.error("setupCheckboxListeners function is not defined.");
                        }
                    }, 100);
                })
                .catch(error => console.error("Error loading utility:", error));
        } else {
            document.getElementById("utility-container").innerHTML = "";
        }
    }

    function executeScripts(container) {
        let scripts = container.getElementsByTagName("script");
        for (let i = 0; i < scripts.length; i++) {
            let newScript = document.createElement("script");
            if (scripts[i].src) {
                newScript.src = scripts[i].src;  // External JS files
            } else {
                newScript.textContent = scripts[i].textContent;  // Inline JS
            }
            document.body.appendChild(newScript);
        }
    }
</script>

</body>
</html>
